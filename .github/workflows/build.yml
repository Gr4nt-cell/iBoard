name: Build iBoard APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Report build errors on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ERR=$(grep -E "^e: |error:|What went wrong" -A3 build.log | head -60 || true)
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -f body="Build failed:
          \`\`\`
          $ERR
          \`\`\`"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk iBoard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: iBoard-apk
          path: iBoard.apk

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest iBoard.apk \
            --title "iBoard build #${{ github.run_number }}" \
            --notes "Automatic build from ${{ github.sha }}. Download iBoard.apk below and install it on your Android phone." \
            --prerelease --target "${{ github.sha }}"
