name: Build iBoard APK

on:
  push:
    branches: [main, gpt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare pinned speech runtime
        run: python3 tools/prepare_speech.py

      - name: Prepare upload key (when the repository secrets are set)
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_B64" ]; then echo "No upload key secrets: bundle will be unsigned."; exit 0; fi
          ALIAS="$(echo -n "${UPLOAD_KEY_ALIAS:-upload}" | tr -d '[:space:]')"; ALIAS="${ALIAS:-upload}"
          STORE_PW="$(echo -n "$UPLOAD_STORE_PASSWORD" | tr -d '\r\n')"
          KEY_PW="$(echo -n "${UPLOAD_KEY_PASSWORD:-$STORE_PW}" | tr -d '\r\n')"; KEY_PW="${KEY_PW:-$STORE_PW}"
          # Tolerate spaces or line breaks pasted into the secret.
          echo -n "$UPLOAD_KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/upload.jks" || true
          echo "Secret lengths: keystore=${#UPLOAD_KEYSTORE_B64} store_password=${#UPLOAD_STORE_PASSWORD} key_password=${#UPLOAD_KEY_PASSWORD} alias=${#UPLOAD_KEY_ALIAS}"
          if keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$STORE_PW" -alias "$ALIAS" >/dev/null 2>&1; then
            keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -storepass "$STORE_PW" -alias "$ALIAS" | grep -m1 "SHA256:" || true
            echo "UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Upload key OK (alias $ALIAS)."
          else
            echo "::warning title=Upload key not usable::The UPLOAD_* secrets don't open the keystore (check UPLOAD_STORE_PASSWORD and UPLOAD_KEY_ALIAS). Building an unsigned bundle instead."
            rm -f "$RUNNER_TEMP/upload.jks"
          fi

      - name: Build APK
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Report build errors on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ERR=$(grep -E "^e: |error:|What went wrong" -A3 build.log | head -60 || true)
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -f body="Build failed:
          \`\`\`
          $ERR
          \`\`\`"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk iBoard.apk

      - name: Build Play bundle (.aab)
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_PATH" ]; then
            NAME=iBoard-signed.aab
          else
            export IBOARD_UNSIGNED=1
            NAME=iBoard-unsigned.aab
          fi
          gradle :app:bundleRelease --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab "$NAME"
          echo "AAB_NAME=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: iBoard-apk
          path: |
            iBoard.apk
            ${{ env.AAB_NAME }}

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest iBoard.apk "$AAB_NAME" \
            --title "iBoard build #${{ github.run_number }}" \
            --notes "Automatic build from ${{ github.sha }}. Download iBoard.apk below and install it on your Android phone." \
            --prerelease --target "${{ github.sha }}"
