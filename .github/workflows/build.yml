name: Build iBoard APK and AAB

on:
  push:
    branches: [main, gpt]
    paths-ignore:
      - 'modules/**'
      - '.github/workflows/*module.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iboard-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare pinned speech runtime
        run: python3 tools/prepare_speech.py

      - name: Prepare upload key (when the repository secrets are set)
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_B64" ]; then echo "No upload key secrets: bundle will be unsigned."; exit 0; fi
          KS="$RUNNER_TEMP/upload.jks"
          # Tolerate spaces or line breaks pasted into the secret.
          echo -n "$UPLOAD_KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$KS" 2>/dev/null || true
          echo "Keystore: $(stat -c %s "$KS") bytes, $(file -b "$KS" | cut -c1-60)"
          clean() { echo -n "$1" | tr -d '\r\n'; }
          STORE_CAND=("$(clean "$SECRET_STORE_PASSWORD")" "$(clean "$SECRET_KEY_PASSWORD")" "$(clean "$SECRET_STORE_PASSWORD" | sed 's/[[:space:]]*$//')")
          STORE_PW=""; STORE_FROM=""
          for i in 0 1 2; do
            pw="${STORE_CAND[$i]}"; [ -z "$pw" ] && continue
            if keytool -list -keystore "$KS" -storepass "$pw" >/dev/null 2>&1; then STORE_PW="$pw"; STORE_FROM=$i; break; fi
          done
          if [ -z "$STORE_PW" ]; then
            echo "::warning title=Upload key not usable::Neither UPLOAD_STORE_PASSWORD nor UPLOAD_KEY_PASSWORD opens the keystore in UPLOAD_KEYSTORE_B64. Building an unsigned bundle."
            rm -f "$KS"; exit 0
          fi
          echo "Keystore opened with $( [ "$STORE_FROM" = 1 ] && echo UPLOAD_KEY_PASSWORD || echo UPLOAD_STORE_PASSWORD )."
          mapfile -t ALIASES < <(keytool -list -keystore "$KS" -storepass "$STORE_PW" 2>/dev/null | grep -i "PrivateKeyEntry" | cut -d, -f1)
          echo "Key entries in keystore: ${#ALIASES[@]} (${ALIASES[*]})"
          WANT="$(echo -n "$SECRET_KEY_ALIAS" | tr -d '[:space:]')"
          ALIAS=""
          for a in "${ALIASES[@]}"; do [ "${a,,}" = "${WANT,,}" ] && ALIAS="$a"; done
          if [ -z "$ALIAS" ]; then ALIAS="${ALIASES[0]}"; echo "UPLOAD_KEY_ALIAS doesn't match a key entry; using '$ALIAS'."; fi
          # Find the key password by signing a tiny test jar.
          echo x > "$RUNNER_TEMP/t.txt"; (cd "$RUNNER_TEMP" && jar cf t.jar t.txt)
          KEY_PW=""
          for pw in "$(clean "$SECRET_KEY_PASSWORD")" "$STORE_PW"; do
            [ -z "$pw" ] && continue
            if jarsigner -keystore "$KS" -storepass "$STORE_PW" -keypass "$pw" "$RUNNER_TEMP/t.jar" "$ALIAS" >/dev/null 2>&1; then KEY_PW="$pw"; break; fi
          done
          if [ -z "$KEY_PW" ]; then
            echo "::warning title=Upload key not usable::The keystore opens, but no secret unlocks key '$ALIAS'. Check UPLOAD_KEY_PASSWORD. Building an unsigned bundle."
            rm -f "$KS"; exit 0
          fi
          keytool -list -v -keystore "$KS" -storepass "$STORE_PW" -alias "$ALIAS" | grep -m1 "SHA256:" || true
          echo "::add-mask::$STORE_PW"; echo "::add-mask::$KEY_PW"
          {
            echo "UPLOAD_KEYSTORE_PATH=$KS"
            echo "UPLOAD_STORE_PASSWORD=$STORE_PW"
            echo "UPLOAD_KEY_PASSWORD=$KEY_PW"
            echo "UPLOAD_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"
          echo "Upload key OK (alias $ALIAS)."

      - name: Run prediction and layout regression tests
        run: gradle :app:testReleaseUnitTest --stacktrace

      - name: Build APK
        run: |
          set -o pipefail
          # The sideload APK keeps the fixed iBoard key so phones can update it; only the bundle uses the upload key.
          env -u UPLOAD_KEYSTORE_PATH gradle :app:assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Preserve build failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iboard-build-failure
          path: build.log
          if-no-files-found: ignore

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk iBoard.apk

      - name: Build Play bundle (.aab)
        run: |
          if [ -n "$UPLOAD_KEYSTORE_PATH" ]; then
            NAME=iBoard-signed.aab
          else
            export IBOARD_UNSIGNED=1
            NAME=iBoard-unsigned.aab
          fi
          gradle :app:bundleRelease --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab "$NAME"
          echo "AAB_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Verify release artifacts
        run: |
          test -s iBoard.apk
          test -s "$AAB_NAME"
          if [ "$AAB_NAME" = "iBoard-signed.aab" ]; then
            jarsigner -verify "$AAB_NAME"
          else
            echo "::notice::AAB is unsigned because no usable upload key was supplied."
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs iBoard.apk

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: iBoard-apk
          path: |
            iBoard.apk
            ${{ env.AAB_NAME }}

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "iBoard latest build" --notes "Built automatically." --prerelease --target "${{ github.sha }}"
          gh release upload latest iBoard.apk "$AAB_NAME" --clobber
          gh release edit latest --title "iBoard 1.0.${{ github.run_number }}" --notes "Built from ${{ github.sha }}. Touch-aware built-in prediction and offline Whisper dictation on every phone; Gemini Nano tools where AICore is available. $AAB_NAME"
